name: CI

on:
  push:
    branches: [feature/vercel-deploy, dev-1, main]
  pull_request:
    branches: [feature/vercel-deploy, dev-1, main]

jobs:
  check:
    name: Type check & Lint
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      AUTH_SECRET: "fake-secret-for-ci-do-not-use-in-prod"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
