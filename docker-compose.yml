# ============================================================
# РАЗРАБОТКА: всё в Docker (Next.js + PostgreSQL + MinIO)
# Запуск:  docker compose up -d --build
# Логи:    docker compose logs -f app
# Стоп:    docker compose down   (данные сохраняются в volumes)
# MinIO:   http://localhost:9001  (login: minioadmin/minioadmin)
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: praktik_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-praktik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praktik}
      POSTGRES_DB: ${POSTGRES_DB:-praktik_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praktik} -d ${POSTGRES_DB:-praktik_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: praktik_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # MinIO Web Console
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Инициализация MinIO: создание бакета при старте
  minio-init:
    image: minio/mc:latest
    container_name: praktik_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET:-praktik};
        mc anonymous set none local/${MINIO_BUCKET:-praktik};
        echo 'MinIO bucket ready';
      "

  app:
    build:
      context: .
      target: dev
    container_name: praktik_app
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-praktik}:${POSTGRES_PASSWORD:-praktik}@db:5432/${POSTGRES_DB:-praktik_db}"
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production!!}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-praktik}
      # Для формирования presigned URLs, доступных с браузера:
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
        ./node_modules/.bin/prisma migrate deploy &&
        npm run dev
      "

volumes:
  pgdata:
  miniodata:
